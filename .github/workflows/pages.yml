# Builds the prototype and publishes it to GitHub Pages.
#
# Before the first run, Pages has to be turned on once:
#   Settings → Pages → Build and deployment → Source: "GitHub Actions"
#
# Pages on a PRIVATE repository requires a paid GitHub plan. On the free plan
# the repository has to be public for the site to be served. The build job
# below runs either way and always uploads a downloadable artifact, so the
# prototype is still retrievable without publishing anything.
name: Deploy prototype to Pages

on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Vite bakes VITE_ variables into the emitted JavaScript, so these two
      # are what connect the published site to the real Supabase project.
      #
      # The URL is a repository *variable* — it is not a secret, it appears in
      # every network request the app makes, and having it readable in the
      # Settings UI makes it checkable at a glance.
      #
      # The key is a repository *secret*. It is the publishable key, which is
      # public by design and ends up in the bundle either way; holding it as a
      # secret keeps it out of the repository and masks it in the build log,
      # which is where it could otherwise leak somewhere it was not meant to
      # go. The service-role key must never be used here — the guard step
      # below fails the build if it finds one.
      - name: Check the build environment
        run: node scripts/guard-build-env.mjs
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      # Typecheck runs as part of `npm run build` (tsc -b && vite build), so a
      # broken build never gets published.
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      # Reads what was actually emitted, rather than trusting the step above:
      # this catches a privileged key arriving from anywhere, and nothing is
      # uploaded or deployed if it finds one.
      - name: Scan the bundle for privileged keys
        run: node scripts/guard-build-env.mjs --scan-dist

      # Downloadable even when Pages is not enabled.
      - name: Upload build for download
        uses: actions/upload-artifact@v4
        with:
          name: scroll-prototype
          path: dist
          retention-days: 30

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
